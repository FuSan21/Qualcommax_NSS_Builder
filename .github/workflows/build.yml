name: Build

# Fork of the upstream builder, trimmed to the one device this repo runs:
# the Xiaomi AX3600, edma-nss flavour, argon theme (cloned in prepare-build.sh).
#   check (upstream moved?) -> draft release -> build -> publish -> prune
# All build parameters live in the `env:` block below and in devices/<group>/config.
on:
  # Dispatch-only. This fork builds images that get flashed by hand, so a run
  # is started deliberately - not by upstream moving, and not by a push here.
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: JuliusBairaktaris/openwrt-nss-edma
  UPSTREAM_REF: nss-edma-rework
  NSS_REPO: JuliusBairaktaris/nss-packages
  NSS_REF: edma-nss
  TARGET: qualcommax/ipq807x
  VARIANT: edma-nss
  RELEASE_PREFIX: edma-nss
  MESH_RELEASE_PREFIX: edma-nss-mesh
  PPE_RELEASE_PREFIX: edma-ppe
  KEEP: "2"                     # newest releases to retain, per prefix
  FEEDS: "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss"

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      nss_sha: ${{ steps.check.outputs.nss_sha }}
      ppe_sha: ${{ steps.check.outputs.ppe_sha }}
      need: ${{ steps.check.outputs.need }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: bash scripts/check-updates.sh

  release:
    name: Create draft release
    needs: check
    if: needs.check.outputs.need == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
      NSS_SHA: ${{ needs.check.outputs.nss_sha }}
      PPE_SHA: ${{ needs.check.outputs.ppe_sha }}
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - id: draft
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          stamp=$(date -u +%Y%m%dT%H%M%SZ)

          # One draft per flavour. The build jobs upload into them; each is
          # published only once every group of both flavours has succeeded, so
          # a partial image set never goes out.
          draft() {
            local prefix="$1" name="$2" tag
            tag="${prefix}-${stamp}-${GITHUB_RUN_ID}"

            {
              echo "## OpenWrt Build — ${name}"
              echo "- **Date**: $date"
              echo "- **Variant**: \`${name}\`"
              if [[ "$prefix" == "$PPE_RELEASE_PREFIX" ]]; then
                echo "- **Target**: \`${TARGET}\` (Xiaomi AX3600 only)"
                echo "- **Upstream**: \`${UPSTREAM_REPO}@${PPE_SHA}\`"
              else
                echo "- **Target**: \`${TARGET}\` (every ipq807x device)"
                echo "- **Upstream**: \`${UPSTREAM_REPO}@${UPSTREAM_SHA}\`"
                if [[ -n "${NSS_SHA}" ]]; then
                  echo "- **NSS**: \`${NSS_SHA}\`"
                fi
              fi
              echo "- **Trigger**: \`${GITHUB_EVENT_NAME}\`"
              echo
              if [[ "$prefix" == "$MESH_RELEASE_PREFIX" ]]; then
                echo "**802.11s mesh offload build.** Same stack as the \`${VARIANT}\`"
                echo "release of the same date, on NSS firmware 11.4.0.5 — the last"
                echo "firmware line that accepts a mesh interface — with the ath11k mesh"
                echo "path/proxy-path offload compiled in. Take this one only if you run"
                echo "802.11s; the \`${VARIANT}\` release carries the newer 12.5 firmware."
                echo
              fi
              if [[ "$prefix" == "$PPE_RELEASE_PREFIX" ]]; then
                echo "**Hardware flow-offload build (no NSS).** The in-kernel"
                echo "\`qca_edma\`/\`qca_ppe\` datapath with netfilter flowtable offload"
                echo "into the PPE flow engine, hardware SQM (\`hw_ppe.qos\`) and the"
                echo "\`ppe-qos\` queue classifiers, all configurable in LuCI"
                echo "(Network -> SQM / Network -> PPE QoS). Xiaomi AX3600 only."
                echo
              fi
              echo "Pick the \`...-<your device>-squashfs-sysupgrade.bin\` asset and flash"
              echo "it over an existing OpenWrt install. These are sysupgrade images only -"
              echo "there is no factory image; install stock OpenWrt first if you are not"
              echo "already running it."
              echo
              if [[ "$prefix" == "$PPE_RELEASE_PREFIX" ]]; then
                echo "Offload and shaping come up from the firewall and sqm config;"
                echo "\`grep -c HW_OFFLOAD /proc/net/nf_conntrack\` shows live hardware flows."
              else
                echo "The offload comes up at boot; \`nss-status\` reports its health."
                echo "To stay on the plain host stack instead:"
                echo "\`uci set nss.general.enabled='0'; uci commit nss; reboot\`."
              fi
            } >release_notes.md

            # stdout is the tag; gh prints the release URL, which would
            # otherwise end up in it.
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "OpenWrt ${name} $date" \
              --notes-file release_notes.md >&2

            printf '%s\n' "$tag"
          }

          {
            echo "tag=$(draft "$RELEASE_PREFIX" "$VARIANT")"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.device }} (${{ matrix.flavour }})
    needs: [check, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # This fork builds only the board it runs. Upstream's other groups
        # (ipq807x-1g/512m/256m) exist because the ath11k memory profile is
        # compile-time and image-wide; they are dropped here, not adopted.
        device: [xiaomi_ax3600]
        # The flavour is a .config fragment on top of the same overlays and the
        # same source trees. Upstream's mesh and ppe flavours are dropped too;
        # re-adding one is this list plus its `include:` entry.
        flavour: [default]
    env:
      GH_TOKEN: ${{ github.token }}
      DEVICE: ${{ matrix.device }}
      CONFIG_FRAGMENT: ${{ matrix.config_fragment }}
      TAG: ${{ needs.release.outputs.tag }}
      # The PPE flavour builds its own branch and adds no NSS feed; VARIANT
      # picks the files.<variant> overlays in prepare-build.sh.
      VARIANT: ${{ matrix.flavour == 'ppe' && 'ppe' || 'edma-nss' }}
      FEEDS: ${{ matrix.flavour == 'ppe' && '' || 'src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss' }}
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Pinned to the ubuntu-26.04 runner. OpenWrt main builds its own
          # flex/bison/etc. host tools, so the host set is the minimal OpenWrt prerequisite list
          # for Ubuntu 26.04. rsync is for prepare-build.sh's overlay step. Everything else
          # (file, wget, unzip, gh) is preinstalled on the GitHub runner image.
          sudo apt-get update
          sudo apt-get install -y \
            bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync

      - name: Checkout OpenWrt source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ matrix.flavour == 'ppe' && needs.check.outputs.ppe_sha || needs.check.outputs.upstream_sha }}
          fetch-depth: 0
          path: openwrt

      - name: Checkout builder repo
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Prepare build environment
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
        run: bash builder/scripts/prepare-build.sh

      - name: Set reproducible-build env
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >>"$GITHUB_ENV"

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done

      - name: Build
        working-directory: openwrt
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed; retrying single-threaded for diagnostics"
            make -j1 V=s
          fi

      - name: Upload images
        run: |
          set -euo pipefail
          out="openwrt/bin/targets/${TARGET}"

          # Sysupgrade images only - no factory/initramfs, per the project's
          # sysupgrade-from-existing-OpenWrt model. Image names carry the
          # device, so the four groups never collide in the release. The build
          # metadata does, so it is uploaded under the group name instead of
          # dropped - it is the answer to "what exactly was in this image".
          mapfile -t assets < <(find "$out" -maxdepth 1 -type f -name 'openwrt-*-squashfs-sysupgrade.bin')
          [[ ${#assets[@]} -gt 0 ]] || { echo "::error::no sysupgrade images in $out"; exit 1; }
          grep 'sysupgrade.bin' "$out/sha256sums" >"sha256sums-${DEVICE}.txt"
          cp "$out/config.buildinfo" "config-${DEVICE}.buildinfo"

          # --clobber, so re-running a job that died mid-upload is a recovery
          # and not a permanent "asset already exists".
          for attempt in 1 2 3; do
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              "${assets[@]}" "sha256sums-${DEVICE}.txt" "config-${DEVICE}.buildinfo" && break
            [[ $attempt -lt 3 ]] || { echo "::error::upload failed after $attempt attempts"; exit 1; }
            echo "::warning::upload attempt $attempt failed; retrying"
            sleep 15
          done

          {
            echo "## ${DEVICE}"
            echo "- assets: ${#assets[@]}"
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [release, build]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Publish or discard
        run: |
          set -euo pipefail
          if [[ "$BUILD_RESULT" != "success" ]]; then
            # A draft left behind is never pruned. Drop it and fail. No
            # --cleanup-tag: a draft's tag exists only inside the release.
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "::error::the build failed ($BUILD_RESULT); draft release discarded"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  prune:
    name: Prune old releases
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Prune
        run: |
          set -euo pipefail
          # Scoped to the prefix, so a release series this fork does not build
          # is never counted against this one's keep window.
          PREFIX="$RELEASE_PREFIX" bash scripts/prune-releases.sh
